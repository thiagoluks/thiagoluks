<text x="350.0" y="488.66" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15.5" font-weight="500" fill="#1a1a1a">Tumour board</text>
<text x="350.0" y="511.16" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15.5" font-weight="500" fill="#1a1a1a">decision</text>

