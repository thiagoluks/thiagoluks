<line x1="1329" y1="175.0" x2="1351" y2="175.0" stroke="#c92a2a" stroke-width="2.4" marker-end="url(#arrowhead-red)"/>

<text x="44" y="284" font-size="14.5" fill="#c92a2a">Limitation:  two separate invasive hepatic angiographies (planning + treatment), &#8776; 1&#8211;2 weeks apart; catheter tip cannot be reproduced exactly &#8594; planned and delivered dose can diverge.</text>
