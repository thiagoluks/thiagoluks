<path d="M 690.0 752 L 690.0 792 L 1100.0 792 L 1100.0 812" fill="none" stroke="#495057" stroke-width="2.4" marker-end="url(#arrowhead)"/>
<rect x="390" y="1000" width="800" height="130" rx="14" fill="#ebfbee" stroke="#2b8a3e" stroke-width="3"/>
<text x="790.0" y="1041.63" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#1a1a1a">VIRTUO virtual twin:</text>
<text x="790.0" y="1065.13" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16.5" font-weight="500" fill="#1a1a1a">fast, interactive prediction and optimisation</text>
<text x="790.0" y="1088.63" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16.5" font-weight="500" fill="#1a1a1a">of injection position for treatment planning</text>

