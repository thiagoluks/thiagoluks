<text x="790.0" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#1a1a1a">VIRTUO methodology: from imaging data to a patient-specific virtual twin</text>
<text x="330" y="78" text-anchor="middle" font-size="14" font-weight="700" fill="#3b5bdb" letter-spacing="0.4">PHASE 1 — PUBLIC DATA (months 1–8)</text>
<text x="1290" y="78" text-anchor="middle" font-size="14" font-weight="700" fill="#0b7285" letter-spacing="0.4">PHASE 2 — CLINICAL COHORT (months 4–24)</text>
<rect x="60" y="92" width="380" height="120" rx="14" fill="#edf2ff" stroke="#3b5bdb" stroke-width="2.2"/>
<text x="250.0" y="140.66" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15.5" font-weight="500" fill="#1a1a1a">MSD Task08 Hepatic Vessel</text>
<text x="250.0" y="163.16" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15.5" font-weight="500" fill="#1a1a1a">443 CT scans, vessel + tumour labels [14]</text>

<rect x="460" y="92" width="380" height="120" rx="14" fill="#edf2ff" stroke="#3b5bdb" stroke-width="2.2"/>
<text x="650.0" y="140.66" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15.5" font-weight="500" fill="#1a1a1a">3D-IRCADb-01</text>
<text x="650.0" y="163.16" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15.5" font-weight="500" fill="#1a1a1a">20 CT scans, liver + vessel labels [15]</text>

<rect x="960" y="92" width="560" height="120" rx="14" fill="#e6fcf5" stroke="#0b7285" stroke-width="2.2"/>
<text x="1240.0" y="129.41" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15.5" font-weight="500" fill="#1a1a1a">LUKS clinical cohort (WP1)</text>
<text x="1240.0" y="151.91" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15.5" font-weight="500" fill="#1a1a1a">~200 patients: CE-CT/MRI, angiography,</text>
<text x="1240.0" y="174.41" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15.5" font-weight="500" fill="#1a1a1a">⁹⁹ᵐTc-MAA SPECT/CT, Y90 PET/CT</text>

<rect x="240" y="262" width="1080" height="130" rx="14" fill="#f3f0ff" stroke="#6741d9" stroke-width="2.2"/>
<text x="780.0" y="304.41" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#1a1a1a">AI hepatic vascular and tumour segmentation (WP2)</text>
<text x="780.0" y="326.91" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15.5" font-weight="500" fill="#1a1a1a">Phase 1: pretrain on public data  →  Phase 2: fine-tune on the LUKS cohort</text>
<text x="780.0" y="349.41" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15.5" font-weight="500" fill="#1a1a1a">(nnU-Net-based multi-class segmentation of hepatic artery, portal vein, liver, tumour)</text>

<line x1="250.0" y1="212" x2="250.0" y2="262" stroke="#495057" stroke-width="2.4" marker-end="url(#arrowhead)"/>

<line x1="650.0" y1="212" x2="650.0" y2="262" stroke="#495057" stroke-width="2.4" marker-end="url(#arrowhead)"/>

<line x1="1240.0" y1="212" x2="1240.0" y2="262" stroke="#495057" stroke-width="2.4" marker-end="url(#arrowhead)"/>

<rect x="490" y="452" width="600" height="110" rx="14" fill="#f8f9fa" stroke="#868e96" stroke-width="2.2"/>
<text x="790.0" y="495.66" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15.5" font-weight="500" fill="#1a1a1a">Patient-specific 3D vascular, liver</text>
<text x="790.0" y="518.1600000000001" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15.5" font-weight="500" fill="#1a1a1a">and tumour model</text>

<line x1="780.0" y1="392" x2="780.0" y2="452" stroke="#495057" stroke-width="2.4" marker-end="url(#arrowhead)"/>

<rect x="300" y="622" width="780" height="130" rx="14" fill="#fff4e6" stroke="#e8590c" stroke-width="2.2"/>
<text x="690.0" y="664.41" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#1a1a1a">Patient-specific CFD particle-transport model (WP3)</text>
<text x="690.0" y="686.91" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15.5" font-weight="500" fill="#1a1a1a">separate parameters for ⁹⁹ᵐTc-MAA and for Y90</text>
<text x="690.0" y="709.41" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15.5" font-weight="500" fill="#1a1a1a">glass/resin microspheres</text>

<rect x="1150" y="622" width="320" height="130" rx="14" fill="#fff9db" stroke="#e8590c" stroke-width="2.2"/>
<text x="1310.0" y="665.19" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="500" fill="#1a1a1a">Validation</text>
<text x="1310.0" y="686.69" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="500" fill="#1a1a1a">vs. clinical MAA-SPECT/CT</text>
<text x="1310.0" y="708.19" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="500" fill="#1a1a1a">and Y90-PET/CT (~200 patients)</text>

<line x1="780.0" y1="562" x2="780.0" y2="622" stroke="#495057" stroke-width="2.4" marker-end="url(#arrowhead)"/>

<line x1="1080" y1="687.0" x2="1150" y2="687.0" stroke="#e8590c" stroke-width="2" stroke-dasharray="6,5" marker-end="url(#arrowhead-amber)"/>
<path d="M 1150 673.0 L 1080 673.0" fill="none" stroke="#e8590c" stroke-width="2" stroke-dasharray="6,5" marker-end="url(#arrowhead-amber)"/>
<text x="1115.0" y="665.0" text-anchor="middle" font-size="12.5" font-style="italic" fill="#e8590c">calibration</text>
<rect x="180" y="812" width="600" height="120" rx="14" fill="#f8f9fa" stroke="#495057" stroke-width="2.2"/>
<text x="480.0" y="860.66" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#1a1a1a">In-silico injection-position</text>
<text x="480.0" y="883.16" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15.5" font-weight="500" fill="#1a1a1a">optimisation (WP4)</text>

<rect x="800" y="812" width="600" height="120" rx="14" fill="#f3f0ff" stroke="#6741d9" stroke-width="2.2"/>
<text x="1100.0" y="860.66" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#1a1a1a">Physics-informed generative AI</text>
<text x="1100.0" y="883.16" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15.5" font-weight="500" fill="#1a1a1a">surrogate model (WP5)</text>

